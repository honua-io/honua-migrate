version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"

  # "/" also scans requirements/release.in and the uv-compiled, hash-locked
  # requirements/release.txt; do not add "/requirements" as a second entry.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/packages/javascript"
    schedule:
      interval: "weekly"
    groups:
      javascript:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/packages/maui"
    schedule:
      interval: "weekly"
    groups:
      dotnet:
        update-types:
          - "minor"
          - "patch"
